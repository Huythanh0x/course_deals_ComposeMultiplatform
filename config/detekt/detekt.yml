build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 25
    ignoreAnnotated:
      - 'Composable'
  LongMethod:
    active: true
    threshold: 100
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 15
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - 'Composable'
  LargeClass:
    active: true
    threshold: 600
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 20
    thresholdInObjects: 20

naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)'
    ignoreAnnotated:
      - 'Composable'
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - '0'
      - '1'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    ignoreAnnotated:
      - 'Composable'
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
  UnusedParameter:
    active: true
    ignoreAnnotated:
      - 'Composable'
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Preview'
  WildcardImport:
    active: true
  UnusedImports:
    active: true

potential-bugs:
  active: true
