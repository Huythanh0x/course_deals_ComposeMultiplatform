plugins {
    id 'coursedeals.kmp.library'
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.openapi.generator)
}

kotlin {
    sourceSets {
        commonMain {
            kotlin.srcDir("src/commonMain/gen")
            dependencies {
                implementation project(':core:common')
                implementation project(':domain:user')
                api libs.ktor.client.core
                implementation libs.ktor.client.content.negotiation
                implementation libs.ktor.serialization.kotlinx.json
                implementation libs.ktor.client.logging
                api libs.kotlinx.serialization.json
                api libs.kotlinx.datetime
                implementation libs.kotlinx.coroutines.core
                implementation libs.koin.core
            }
        }
        jvmMain {
            dependencies {
                implementation libs.ktor.client.okhttp
            }
        }
        appleMain {
            dependencies {
                implementation libs.ktor.client.darwin
            }
        }
    }
}

def openApiSpecFile = file("$projectDir/openapi/openapi.json")
def backendSpecFile = file("${rootProject.projectDir}/../course_deals_backend/openapi/openapi.json")
def openApiBuildDir = layout.buildDirectory.dir("generated/openapi")
def openApiGenSrcDir = file("$projectDir/src/commonMain/gen")

tasks.register("syncOpenApiSpec") {
    group = "openapi"
    description = "Syncs openapi.json from course_deals_backend when available."
    doLast {
        if (backendSpecFile.exists() && backendSpecFile.text.contains("/api/v1/app/config")) {
            openApiSpecFile.parentFile.mkdirs()
            openApiSpecFile.text = backendSpecFile.text
            logger.lifecycle("Synced OpenAPI spec from ${backendSpecFile.absolutePath} to ${openApiSpecFile.absolutePath}")
        } else if (!openApiSpecFile.exists()) {
            throw new GradleException("OpenAPI spec not found at ${openApiSpecFile.absolutePath} or ${backendSpecFile.absolutePath}")
        }
    }
}

openApiGenerate {
    generatorName.set("kotlin")
    library.set("multiplatform")
    inputSpec.set(openApiSpecFile.absolutePath)
    outputDir.set(openApiBuildDir.map { it.asFile.absolutePath })
    packageName.set("com.thanh0x.coursedeals.core.network.openapi")
    apiPackage.set("com.thanh0x.coursedeals.core.network.openapi.api")
    modelPackage.set("com.thanh0x.coursedeals.core.network.openapi.model")
    configOptions.set([
        dateLibrary: "kotlinx-datetime",
        enumPropertyNaming: "UPPERCASE"
    ])
    generateApiTests.set(false)
    generateModelTests.set(false)
    generateApiDocumentation.set(false)
    generateModelDocumentation.set(false)
}

tasks.named("openApiGenerate") {
    dependsOn("syncOpenApiSpec")
}

tasks.register("generateCourseDealsApi") {
    group = "openapi"
    description = "Generates KMP Ktor API clients and @Serializable DTOs from openapi.json into src/commonMain/gen."
    dependsOn("openApiGenerate")
    inputs.file(openApiSpecFile)
    outputs.dir(openApiGenSrcDir)
    def buildGenDir = openApiBuildDir
    def targetGenDir = openApiGenSrcDir
    doLast {
        def generatedCommonKotlin = new File(buildGenDir.get().asFile, "src/commonMain/kotlin")
        if (!generatedCommonKotlin.exists()) {
            throw new GradleException("Expected generated sources at ${generatedCommonKotlin.absolutePath}")
        }
        if (targetGenDir.exists()) {
            targetGenDir.deleteDir()
        }
        generatedCommonKotlin.eachFileRecurse { File srcFile ->
            if (srcFile.isFile() && srcFile.name.endsWith(".kt")) {
                def relativePath = generatedCommonKotlin.toPath().relativize(srcFile.toPath()).toString()
                def destFile = new File(targetGenDir, relativePath)
                destFile.parentFile.mkdirs()
                String content = srcFile.getText("UTF-8")
                String sanitized = content
                    .replace("io.ktor.client.features.", "io.ktor.client.plugins.")
                    .replace("kotlinx.serialization.internal.", "kotlinx.serialization.builtins.")
                destFile.setText(sanitized, "UTF-8")
            }
        }
        logger.lifecycle("Generated KMP OpenAPI sources in ${targetGenDir.absolutePath}")
    }
}

tasks.matching {
    (it.name.startsWith("compile") && it.name.contains("Kotlin")) || it.name.endsWith("SourcesJar")
}.configureEach {
    dependsOn("generateCourseDealsApi")
}

