plugins {
    id 'coursedeals.kmp.library'
    alias(libs.plugins.buildconfig)
}

static def detectHostLanIp() {
    try {
        def en = java.net.NetworkInterface.getNetworkInterfaces()
        def candidate = null
        while (en.hasMoreElements()) {
            def interFace = en.nextElement()
            if (!interFace.isUp() || interFace.isLoopback() || interFace.isVirtual()) continue
            def enumIpAddress = interFace.getInetAddresses()
            while (enumIpAddress.hasMoreElements()) {
                def inetAddress = enumIpAddress.nextElement()
                if (inetAddress instanceof java.net.Inet4Address) {
                    String name = interFace.getName().toLowerCase()
                    if (name.startsWith("en") || name.startsWith("eth") || name.startsWith("wlan")) {
                        return inetAddress.getHostAddress()
                    }
                    candidate = inetAddress.getHostAddress()
                }
            }
        }
        if (candidate != null) return candidate
    } catch (Exception ignored) {
    }
    return "127.0.0.1"
}

def resolveLocalApiBaseUrl() {
    def propUrl = project.findProperty("localApiUrl")?.toString()?.trim()
    if (propUrl) return propUrl
    def envUrl = System.getenv("LOCAL_API_URL")?.trim()
    if (envUrl) return envUrl
    def physicalLocal = project.findProperty("physicalDeviceLocal")?.toString()?.toBoolean() ?: false
    if (physicalLocal) {
        def port = project.findProperty("localApiPort")?.toString()?.trim() ?: "8081"
        return "http://${detectHostLanIp()}:${port}"
    }
    return ""
}

buildConfig {
    packageName("com.thanh0x.coursedeals.core.common")
    useKotlinOutput {
        internalVisibility = false
    }
    buildConfigField('boolean', 'FEATURE_FINGERPRINT', 'false')
    buildConfigField('String', 'LOCAL_API_BASE_URL', "\"${resolveLocalApiBaseUrl()}\"")
}

