plugins {
    id 'coursedeals.kmp.library'
    alias(libs.plugins.buildconfig)
}

buildConfig {
    packageName("com.thanh0x.coursedeals.core.common")
    useKotlinOutput {
        internalVisibility = false
    }
    buildConfigField('boolean', 'FEATURE_FINGERPRINT', 'false')
}

kotlin {
    watchosArm64()
    watchosDeviceArm64()
    watchosSimulatorArm64()

    sourceSets {
        commonMain {
            dependencies {
                implementation libs.kotlinx.coroutines.core
            }
        }
        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
    }
}
