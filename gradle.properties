# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# JVM arguments - 8GB heap for multiplatform Native linking + parallel KSP / AGP tasks
org.gradle.jvmargs=-Xmx8192m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx4096m
kotlin.native.ignoreDisabledTargets=true

# Multi-module parallel task execution
org.gradle.parallel=true

# Gradle Build Cache for task output reuse across builds
org.gradle.caching=true

# Configuration Cache for instant task graph reuse
org.gradle.configuration-cache=true

# Virtual File System watching for instant file change detection
org.gradle.vfs.watch=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# R class optimization
android.nonTransitiveRClass=true
