plugins {
    id 'coursedeals.android.library'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
}

def getGoogleWebClientId() {
    Properties properties = new Properties()
    def localPropertiesFile = project.rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        properties.load(localPropertiesFile.newDataInputStream())
    }
    def clientId = properties.getProperty("google.web.client.id") ?: System.getenv("GOOGLE_WEB_CLIENT_ID")
    if (clientId != null && !clientId.trim().isEmpty()) {
        return clientId.trim()
    }
    return "YOUR_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com"
}

android {
    namespace 'com.thanh0x.coursedeals.feature.auth'

    buildFeatures {
        resValues true
    }

    defaultConfig {
        resValue "string", "google_web_client_id", getGoogleWebClientId()
    }
}

dependencies {
    implementation project(':core:ui')
    implementation project(':core:common')
    implementation project(':domain:user')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.biometric
    implementation libs.androidx.credentials
    implementation libs.androidx.credentials.play.services.auth
    implementation libs.googleid
    implementation libs.timber
}
