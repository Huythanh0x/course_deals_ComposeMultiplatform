plugins {
    id 'coursedeals.android.library'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    alias(libs.plugins.kotlin.compose)
}

def getGoogleWebClientId() {
    Properties properties = new Properties()
    def localPropertiesFile = project.rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        properties.load(localPropertiesFile.newDataInputStream())
    }
    def clientId = properties.getProperty("google.web.client.id") ?: System.getenv("GOOGLE_WEB_CLIENT_ID")
    if (clientId != null && !clientId.trim().isEmpty()) {
        return clientId.trim()
    }
    return "YOUR_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com"
}

android {
    namespace 'com.thanh0x.coursedeals.feature.auth'

    buildFeatures {
        resValues true
        compose true
    }

    defaultConfig {
        resValue "string", "google_web_client_id", getGoogleWebClientId()
    }
}

