android {
    namespace 'com.thanh0x.coursedeals'
    compileSdk 37

    defaultConfig {
        applicationId "com.thanh0x.coursedeals"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }

    flavorDimensions += "environment"
    productFlavors {
        local {
            dimension "environment"
            buildConfigField "String", "BASE_URL_API", "\"${getLocalApiUrl()}\""
        }
        prod {
            dimension "environment"
            buildConfigField "String", "BASE_URL_API", "\"https://coupons-api.thanh0x.com\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }
}

