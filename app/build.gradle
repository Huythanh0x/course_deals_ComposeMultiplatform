import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.batdaulaptrinh.freeudemycoupons'
    compileSdk 37

    defaultConfig {
        applicationId "com.batdaulaptrinh.freeudemycoupons"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    //Coordinator layout
    implementation("androidx.coordinatorlayout:coordinatorlayout:1.3.0")
    //Material components
    implementation 'com.google.android.material:material:1.14.0'
    //Navigation component
    implementation("androidx.navigation:navigation-fragment:2.9.8")
    implementation("androidx.navigation:navigation-ui:2.9.8")
    //Room component
    implementation("androidx.room:room-runtime:2.8.4")
    ksp("androidx.room:room-compiler:2.8.4")
    implementation("androidx.room:room-ktx:2.8.4")
    implementation("androidx.room:room-paging:2.8.4")
    implementation("androidx.room:room-testing:2.8.4")
    //Datastore
    implementation("androidx.datastore:datastore-preferences:1.2.1")
    //Recyclerview
    implementation("androidx.recyclerview:recyclerview:1.4.0")
    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    //Dagger-Hilt
    implementation 'androidx.hilt:hilt-common:1.4.0'
    ksp 'androidx.hilt:hilt-compiler:1.4.0'
    implementation "com.google.dagger:dagger:2.60.1"
    ksp "com.google.dagger:hilt-android-compiler:2.60.1"
    implementation "com.google.dagger:hilt-android:2.60.1"
    //Coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0")
    //Lifecycle
    implementation("androidx.lifecycle:lifecycle-extensions:2.2.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.11.0")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.11.0")
    //Loading image
    implementation 'com.squareup.picasso:picasso:2.71828'
    //Gson
    implementation 'com.google.code.gson:gson:2.14.0'
    //Jsoup
    implementation('org.jsoup:jsoup:1.22.2')
    //circular avatar
    implementation('com.mikhaellopez:circularimageview:4.3.1')
    //paging
    implementation("androidx.paging:paging-runtime:3.5.0")
    //finger print
    implementation "androidx.biometric:biometric:1.1.0"
}