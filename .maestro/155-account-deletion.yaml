appId: com.thanh0x.coursedeals
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "PROFILE"
    timeout: 15000
- tapOn: "PROFILE"
- scrollUntilVisible:
    element:
      text: "Delete Account"
    direction: DOWN
    timeout: 10000
- tapOn: "Delete Account"
- assertVisible: "Delete Account"
- assertVisible: "Are you sure you want to permanently delete your account and all associated data? This action cannot be undone."
- takeScreenshot: .maestro/screenshots/155-delete-dialog-before-delete
- tapOn: "Delete"
- takeScreenshot: .maestro/screenshots/155-after-delete-called
