appId: ${APP_ID}
---
# Verify Apple Watch Handoff & Deep-Link continuation directly into Course Detail (Course ID 501)
- launchApp:
    clearState: false
    arguments:
      deeplink: "coursedeals://courses/501"
      "--deeplink=coursedeals://courses/501": "true"

- extendedWaitUntil:
    visible: "Enroll Now"
    timeout: 15000

- assertVisible: "Enroll Now"
- assertVisible: "Report"
- takeScreenshot: 01_ios_handoff_course_detail
