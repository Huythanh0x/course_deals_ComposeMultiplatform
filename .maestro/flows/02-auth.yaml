appId: ${APP_ID}
---
- launchApp:
    clearState: false
# Ensure we navigate to Login screen if currently in Main feed (e.g. on iOS)
- runFlow:
    when:
      visible: "PROFILE"
    commands:
      - tapOn: "PROFILE"
      - runFlow:
          when:
            visible: "Log Out"
          commands:
            - tapOn: "Log Out"
      - runFlow:
          when:
            visible: "Sign in to Access Settings"
          commands:
            - tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Email"
    timeout: 10000
- assertVisible: "Email"
- assertVisible: "Continue with Email"
- assertNotVisible: "Password"
# Continue / Guest bypass login
- tapOn: "Access as Guest"
- extendedWaitUntil:
    visible: "HOME"
    timeout: 10000
- assertVisible: "HOME"
