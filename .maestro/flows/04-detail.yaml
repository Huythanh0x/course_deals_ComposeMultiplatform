appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Access as Guest"
    timeout: 15000
- tapOn: "Access as Guest"
- extendedWaitUntil:
    visible: "HOME"
    timeout: 15000
- tapOn: "HOME"
- extendedWaitUntil:
    visible: "Search courses"
    timeout: 10000
# Reset filter to show all courses
- tapOn: "Filter"
- extendedWaitUntil:
    visible: "Reset"
    timeout: 5000
- tapOn: "Reset"
- tapOn: "Apply"
- extendedWaitUntil:
    visible: "Search courses"
    timeout: 10000
- tapOn: "Search courses"
- inputText: "Management"
- extendedWaitUntil:
    visible: "Professional Diploma in Procurement Management"
    timeout: 15000
- tapOn: "Professional Diploma in Procurement Management"
- extendedWaitUntil:
    visible: "Enroll Now"
    timeout: 10000
- assertVisible: "Enroll Now"
- extendedWaitUntil:
    visible: "Report"
    timeout: 5000
- assertVisible: "Report"
- tapOn: "Report"
# Verify bottom sheet report dialog opens
- extendedWaitUntil:
    visible: "Report this deal"
    timeout: 5000
- assertVisible: "Report this deal"
# Select reason 'Expired deal'
- tapOn: "Expired deal"
# Submit report
- tapOn: "Submit"
# Verify bottom sheet dismisses & success feedback displays
- extendedWaitUntil:
    visible: "Report submitted successfully"
    timeout: 5000
- assertVisible: "Report submitted successfully"
# Back navigation
- back
- extendedWaitUntil:
    visible: "HOME"
    timeout: 10000
- assertVisible: "HOME"
