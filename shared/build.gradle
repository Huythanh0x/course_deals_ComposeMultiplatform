def watchContractKotlinFile = file("$projectDir/src/commonMain/kotlin/com/thanh0x/coursedeals/shared/watch/WatchDealContract.kt")
def generatedWatchSwiftFile = file("${rootProject.projectDir}/iosApp/WatchApp/Generated/WatchDealDto.generated.swift")

tasks.register("generateWatchSwiftModels") {
    group = "codegen"
    description = "Generates Swift Codable WatchDealModel & WatchCoursePlatform from Kotlin @Serializable WatchDealContract.kt"
    inputs.file(watchContractKotlinFile)
    outputs.file(generatedWatchSwiftFile)

    doLast {
        if (!watchContractKotlinFile.exists()) {
            throw new GradleException("Missing Kotlin contract file: ${watchContractKotlinFile}")
        }
        def kotlinSource = watchContractKotlinFile.getText("UTF-8")
        def dtoMatcher = (kotlinSource =~ /(?s)data class WatchDealDto\((.*?)\)/)
        if (!dtoMatcher.find()) {
            throw new GradleException("Could not locate data class WatchDealDto(...) in ${watchContractKotlinFile}")
        }
        def dtoBody = dtoMatcher.group(1)
        def propRegex = ~/val\s+(\w+)\s*:\s*([A-Za-z0-9_]+)(\?)?/
        def typeMap = [
            "Int"                : "Int",
            "Long"               : "Int64",
            "Double"             : "Double",
            "Boolean"            : "Bool",
            "String"             : "String",
            "WatchCoursePlatform": "WatchCoursePlatform"
        ]
        def properties = []
        dtoBody.eachLine { line ->
            def m = propRegex.matcher(line.trim())
            if (m.find()) {
                def propName = m.group(1)
                def ktType = m.group(2)
                def isNullable = m.group(3) != null
                def swiftBaseType = typeMap[ktType] ?: ktType
                def swiftType = isNullable ? "${swiftBaseType}?" : swiftBaseType
                def mutability = (propName == "isBookmarked") ? "var" : "let"
                properties << [name: propName, swiftType: swiftType, mutability: mutability]
            }
        }
        if (properties.isEmpty()) {
            throw new GradleException("No properties parsed from WatchDealDto in ${watchContractKotlinFile}")
        }

        def structFieldsBlock = properties.collect { p ->
            "    public ${p.mutability} ${p.name}: ${p.swiftType}"
        }.join("\n")

        generatedWatchSwiftFile.parentFile.mkdirs()
        generatedWatchSwiftFile.setText("""// AUTO-GENERATED BY ./gradlew :shared:generateWatchSwiftModels FROM WatchDealContract.kt — DO NOT EDIT
import Foundation

public enum WatchCoursePlatform: String, Codable, CaseIterable {
    case udemy = "Udemy"
    case coursera = "Coursera"
    case edx = "edX"

    public init(from decoder: Decoder) throws {
        let container = try decoder.singleValueContainer()
        let raw = (try? container.decode(String.self)) ?? "Udemy"
        self = Self.infer(raw: raw)
    }

    public func encode(to encoder: Encoder) throws {
        var container = encoder.singleValueContainer()
        try container.encode(self.rawValue)
    }

    public static func infer(
        raw: String? = nil,
        previewImage: String? = nil,
        title: String? = nil
    ) -> WatchCoursePlatform {
        let normalized = (raw ?? "").trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
        let combined = "\\(previewImage ?? "") \\(title ?? "")".lowercased()
        if normalized == "coursera" || combined.contains("coursera") {
            return .coursera
        } else if normalized == "edx" || combined.contains("edx") {
            return .edx
        } else {
            return .udemy
        }
    }
}

