public struct WatchHotDealsEnvelope: Codable {
    public let courses: [WatchDealModel]?
    public let deals: [WatchDealModel]?

    public static func decodeDeals(from data: Data) -> [WatchDealModel] {
        let decoder = JSONDecoder()
        if let directArray = try? decoder.decode([WatchDealModel].self, from: data) {
            return directArray
        }
        if let envelope = try? decoder.decode(WatchHotDealsEnvelope.self, from: data) {
            if let courses = envelope.courses, !courses.isEmpty {
                return courses
            }
            if let deals = envelope.deals, !deals.isEmpty {
                return deals
            }
        }
        return []
    }

    public static func decodeDeals(from jsonObject: Any) -> [WatchDealModel] {
        guard JSONSerialization.isValidJSONObject(jsonObject),
              let data = try? JSONSerialization.data(withJSONObject: jsonObject, options: []) else {
            return []
        }
        return decodeDeals(from: data)
    }
