name: Release CD (Client)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string
      is_draft:
        description: 'Publish as Draft'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Publish as Pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Prod Release APK
        run: ./gradlew :app:assembleProdRelease -x test --continue

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          VERSION_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TAG="${{ inputs.tag_name }}"
          fi
          CLEAN_VER="${VERSION_TAG#v}"
          SOURCE_APK=$(find app/build/outputs/apk/prod/release -name "*.apk" | head -n 1)
          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "release-assets/CourseDeals-${CLEAN_VER}-android.apk"
          fi

      - name: Upload Android Asset
        uses: actions/upload-artifact@v4
        with:
          name: client-android-artifact
          path: release-assets/*
          retention-days: 1

  build-ios:
    name: Build iOS IPA / Framework
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Link iOS Release Framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 -x test

      - name: Archive Xcode Project
        run: |
          mkdir -p release-assets build/ios-archive
          VERSION_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TAG="${{ inputs.tag_name }}"
          fi
          CLEAN_VER="${VERSION_TAG#v}"

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/ios-archive/iosApp-${CLEAN_VER}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          APP_PATH="build/ios-archive/iosApp-${CLEAN_VER}.xcarchive/Products/Applications/iosApp.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p build/ios-archive/Payload
            cp -R "$APP_PATH" build/ios-archive/Payload/
            (cd build/ios-archive && zip -q -r "${{ github.workspace }}/release-assets/CourseDeals-${CLEAN_VER}-ios.ipa" Payload)
          else
            (cd build/ios-archive && zip -q -r "${{ github.workspace }}/release-assets/CourseDeals-${CLEAN_VER}-ios.xcarchive.zip" "iosApp-${CLEAN_VER}.xcarchive")
          fi

      - name: Upload iOS Asset
        uses: actions/upload-artifact@v4
        with:
          name: client-ios-artifact
          path: release-assets/*
          retention-days: 1

  publish-github-release:
    name: Publish Client GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true

      - name: Compute SHA256 Checksums
        run: |
          cd release-downloads
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: CourseDeals Mobile & Desktop ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.is_draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || false }}
          generate_release_notes: true
          files: |
            release-downloads/*
