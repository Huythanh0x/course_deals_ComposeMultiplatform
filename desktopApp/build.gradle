import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.jvm'
    alias(libs.plugins.compose.multiplatform)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.detekt)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    source.setFrom(
        files(
            "src/main/kotlin",
            "src/test/kotlin",
        )
    )
}

dependencies {
    implementation project(':shared')
    implementation project(':core:common')
    implementation project(':core:logging')
    implementation project(':core:network')
    implementation project(':core:ui')
    implementation project(':domain:coupons')
    implementation project(':domain:user')
    implementation project(':data:coupons')
    implementation project(':data:user')
    implementation project(':feature:auth')
    implementation project(':feature:home')
    implementation project(':feature:course')
    implementation project(':feature:detail')
    implementation project(':feature:enroll')
    implementation project(':feature:profile')
    implementation project(':feature:splash')
    implementation compose.desktop.currentOs
    implementation compose.material3
    implementation compose.materialIconsExtended
    implementation libs.kotlinx.coroutines.swing
    implementation libs.ktor.client.core
    implementation libs.ktor.client.okhttp
    implementation libs.koin.core
    implementation libs.compose.webview.multiplatform

    testImplementation libs.junit
    testImplementation compose.desktop.uiTestJUnit4
    testImplementation compose.desktop.currentOs
}

compose.desktop {
    application {
        mainClass = "com.thanh0x.coursedeals.desktop.MainKt"
        nativeDistributions {
            targetFormats(org.jetbrains.compose.desktop.application.dsl.TargetFormat.Dmg)
            packageName = "CourseDeals"
            packageVersion = "1.0.0"
            macOS {
                bundleID = "com.thanh0x.coursedeals"
            }
            modules(
                "java.base",
                "java.desktop",
                "java.instrument",
                "java.logging",
                "java.management",
                "java.naming",
                "java.net.http",
                "java.security.jgss",
                "java.security.sasl",
                "java.sql",
                "jdk.unsupported"
            )
        }
        buildTypes.release.proguard {
            isEnabled().set(true)
            obfuscate.set(false)
            configurationFiles.from(project.file("compose-desktop.pro"))
        }
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs("--add-opens", "java.desktop/sun.awt=ALL-UNNAMED")
    jvmArgs("--add-opens", "java.desktop/java.awt.peer=ALL-UNNAMED")
    def os = System.getProperty("os.name", "").toLowerCase(java.util.Locale.ROOT)
    if (os.contains("mac")) {
        jvmArgs("--add-opens", "java.desktop/sun.lwawt=ALL-UNNAMED")
        jvmArgs("--add-opens", "java.desktop/sun.lwawt.macosx=ALL-UNNAMED")
    }
    def sysArgsProp = providers.systemProperty("coursedeals.args").orNull
    if (sysArgsProp != null && !sysArgsProp.trim().isEmpty()) {
        systemProperty("coursedeals.args", sysArgsProp.trim())
    }
    def appArgsProp = providers.gradleProperty("appArgs").orNull
    if (appArgsProp != null && !appArgsProp.trim().isEmpty()) {
        args(appArgsProp.trim().split("\\s+").toList())
    }
}

tasks.register('runMaestroFlow', Test) {
    description = 'Executes a .maestro/flows/*.yaml E2E flow on Compose Desktop.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching "com.thanh0x.coursedeals.desktop.maestro.DesktopMaestroFlowRunnerTest.runConfiguredMaestroFlowFromCli"
    }
    def flowProp = providers.gradleProperty("flow")
        .orElse(providers.systemProperty("maestro.flow"))
        .orElse("")
    def screenshotDirProp = providers.gradleProperty("screenshotDir")
        .orElse(providers.systemProperty("maestro.screenshotDir"))
        .orElse("/tmp/desktop-maestro-screenshots")
    systemProperty("maestro.flow", flowProp.get())
    systemProperty("maestro.screenshotDir", screenshotDirProp.get())
    outputs.upToDateWhen { false }
}
