pluginManagement {
    includeBuild("build-logic")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
    id("com.gradle.develocity") version "3.19.2"
}
develocity {
    buildScan {
        termsOfUseUrl = "https://gradle.com/help/legal-terms-of-use"
        termsOfUseAgree = "yes"
        publishing.onlyIf { System.getenv("CI") != null }
        uploadInBackground = System.getenv("CI") == null
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository {
                ivy {
                    name = "sentryCocoaReleases"
                    url = uri("https://github.com/getsentry/sentry-cocoa/releases/download")
                    patternLayout { artifact("[revision]/[artifact].[ext]") }
                    metadataSources { artifact() }
                }
            }
            filter {
                includeModule("io.sentry.native", "Sentry-Dynamic")
                includeModule("io.sentry.native", "Sentry")
            }
        }
    }
}
rootProject.name = "course-deals"
include ':app'
include ':desktopApp'
include ':webApp'
include ':shared'
include ':core:common'
include ':core:logging'
include ':core:ui'
include ':core:network'
include ':domain:coupons'
include ':domain:user'
include ':data:coupons'
include ':data:user'
include ':feature:home'
include ':feature:profile'
include ':feature:detail'
include ':feature:auth'
include ':feature:splash'
include ':feature:course'
include ':feature:enroll'
